        <div class="row g-4 justify-content-center">
          <!-- 表單 -->
          <div class="col-12 col-lg-6 d-flex">
            <div class="form-card flex-fill">
              <p class="form-help">感謝您的資訊，我們將會盡快與您聯繫。</p>
              <form name="myform" id="myform" action="contact.php" method="post" novalidate>
                <input type="hidden" name="Mode" value="Post_Send" />
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label for="Name" class="form-label">姓名 NAME</label>
                    <input name="Name" id="Name" type="text" class="form-control" required />
                    <div class="invalid-feedback">請輸入姓名</div>
                  </div>
                  <div class="col-sm-6">
                    <label for="Tel" class="form-label">電話 TEL</label>
                    <input name="Tel" id="Tel" type="tel" inputmode="tel" class="form-control" placeholder="例如：0912-345-678" />
                  </div>
                  <div class="col-12">
                    <label for="WT" class="form-label">LINE ID</label>
                    <input name="WT" id="WT" type="text" class="form-control" />
                  </div>
                  <div class="col-12">
                    <label for="EMail" class="form-label">信箱 Email</label>
                    <input name="EMail" id="EMail" type="email" class="form-control" required />
                    <div class="invalid-feedback">請輸入有效的 Email</div>
                  </div>
                  <div class="col-sm-6">
                    <label for="Room" class="form-label">您的空間性質為何？</label>
                    <select name="Room" id="Room" class="form-select">
                      <option value="預售屋">預售屋</option>
                      <option value="新成屋（5年以下）">新成屋（5年以下）</option>
                      <option value="中古屋（5~15年）">中古屋（5~15年）</option>
                      <option value="老屋（15年以上）">老屋（15年以上）</option>
                      <option value="辦公室空間">辦公室空間</option>
                      <option value="商業空間">商業空間</option>
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label for="Money" class="form-label">您的執行預算？</label>
                    <select name="Money" id="Money" class="form-select">
                      <option value="100-150萬">100-150萬</option>
                      <option value="150-200萬">150-200萬</option>
                      <option value="200-250萬">200-250萬</option>
                      <option value="250-300萬">250-300萬</option>
                      <option value="300-500萬">300-500萬</option>
                      <option value="500萬以上">500萬以上</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label for="Square" class="form-label">您的空間坪數</label>
                    <input name="Square" id="Square" type="text" class="form-control" placeholder="例如：30 坪" />
                  </div>
                  <div class="col-12">
                    <label for="Message" class="form-label">備註</label>
                    <textarea name="Message" id="Message" rows="5" class="form-control" placeholder="想要的風格／格局想法／預計開工時間…"></textarea>
                  </div>

                  <!-- 驗證碼 -->
                  <div class="col-12">
                    <label for="PostAuthCode" class="form-label">驗證碼</label>
                    <div class="input-group">
                      <input type="text" name="PostAuthCode" id="PostAuthCode" class="form-control" aria-label="驗證碼輸入" />
                      <span class="input-group-text p-0">
                        <img src="/images/captcha.png" id="AuthCode" alt="驗證碼" style="height:42px; cursor:pointer; border-radius:0 12px 12px 0" title="點擊更新驗證碼" />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Navbar 捲動狀態 & Logo 交換
      window.addEventListener("scroll", function() {
          const navbar = document.querySelector(".navbar");
          const logo = document.getElementById("navbarLogo");
          if (window.scrollY > 50) {
              navbar.classList.remove("navbar-transparent");
              navbar.classList.add("navbar-colored");
          } else {
              navbar.classList.add("navbar-transparent");
              navbar.classList.remove("navbar-colored");
          }
      });

      // 驗證碼點擊更新
      const authImg = document.getElementById('AuthCode');
      if (authImg) {
        authImg.addEventListener('click', () => {
          authImg.src = 'AuthCode.php?' + Math.random();
        });
      }

      // Bootstrap 原生前端驗證（加上 novalidate 即可生效）
      (() => {
        const form = document.getElementById('myform');
        form.addEventListener('submit', (event) => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      })();
    </script>
