        }

          height: 60px;

        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 8px;          /* 給捲軸一點空間 */
        max-width: 100%;
      }

      .thumb-wrapper {
        display: flex;
        flex-wrap: nowrap;
      }

      .thumb-img {
        flex: 0 0 auto;               /* 固定大小，不被壓縮 */
        width: 150px;
        height: 105px;
        margin-right: 0.5rem;
        border-radius: 4px;
        object-fit: cover;
        opacity: 0.5;
        cursor: pointer;
        transition: 0.3s ease;
      }

      /* 顯示最多 8 張，超過就必須滑動 */

        max-width: calc(150px * 8 + 0.5rem * 7); /* 8 張縮圖 + 間距 */

      }

      /* 美化滾動條 */

      .thumbnail-nav::-webkit-scrollbar-thumb { background: #c8b8a8; border-radius: 4px; }

    <script>
        AOS.init();

        window.addEventListener("scroll", function () {
            const navbar = document.querySelector(".navbar");
            const logo = document.getElementById("navbarLogo");

            if (window.scrollY > 50) {
                navbar.classList.remove("navbar-transparent");
                navbar.classList.add("navbar-colored");
            } else {
                navbar.classList.add("navbar-transparent");
                navbar.classList.remove("navbar-colored");
            }
        });
    </script>
