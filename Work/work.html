<!DOCTYPE html>
<html lang="zh-Hant">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設計作品｜同翕設計</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <style>
        body {
        background-color: #f8f0e6;
        font-family: "Noto Serif TC", serif;
        color: #5a4a3f;
        }

        .navbar-custom {
        transition: background-color 0.3s ease;
        padding: 1rem 0;
        }

        .navbar-transparent {
        background-color: transparent !important;
        }

        .navbar-colored {
        background-color: #f8f0e6 !important;
        }

        .navbar-colored .nav-link {
        color: #000 !important;
        }

        .navbar-brand img {
        height: 40px;
        transition: all 0.3s ease;
        }

        .hero {
        background-image: url("../images/hero-bgc.jpg");
        background-size: cover;
        background-position: center;
        height: 50vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        position: relative;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        }

        .hero h1 {
        position: relative;
        z-index: 1;
        font-size: 2.5rem;
        }

        .gallery-section {
        padding: 5rem 1rem;
        }

        .work-card {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            aspect-ratio: 4 / 3; /* 強制比例 */
        }

        .work-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 超過就裁切 */
            transition: transform 0.5s ease;
            display: block;
        }

        .work-card:hover img {
            transform: scale(1.05);
        }

        .work-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(248, 240, 230, 0.9);
        color: #5a4a3f;
        padding: 1rem;
        text-align: center;
        font-weight: bold;
        font-size: 1.1rem;
        transition: transform 0.3s ease;
        }

        @media (max-width: 576px) {
        .hero h1 {
            font-size: 1.75rem;
        }
        .work-info {
            font-size: 1rem;
            padding: 0.75rem;
        }
        .navbar-collapse {
            background-color: #f8f0e6;
            padding: 1rem;
        }
        }
    </style>
    </head>
    <body>
        <!-- 導覽列 -->
        <nav class="navbar navbar-expand-lg fixed-top navbar-custom navbar-transparent">
            <div class="container px-4">
            <a class="navbar-brand" href="/index.html">
                <img id="navbarLogo" src="../images/logoNocolor.png" alt="logo" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="bi bi-list fs-1 text-white"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white me-3" href="/index.html">關於我們</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="/Work/work.html">設計作品</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="/Process/process.html">服務流程</a></li>
                <li class="nav-item"><a class="nav-link text-white me-3" href="/Contact/contact.html">聯繫我們</a></li>
                </ul>
            </div>
            </div>
        </nav>

        <section class="hero">
            <h1>設計作品</h1>
        </section>

        <section class="container gallery-section">
            <div class="row g-4">
                <!-- 作品卡片 -->
                <div class="col-md-6" data-aos="fade-up">
                    <a href="Work_Detail_Page.html" class="text-decoration-none">
                        <div class="work-card">
                            <img src="../images/ThemisWeb/test1.jpg" alt="作品1" loading="lazy">
                            <div class="work-info">現代住宅 × 簡約風</div>
                        </div>
                    </a>
                </div>

                <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                    <a href="#" class="text-decoration-none">
                        <div class="work-card">
                            <img src="../images/ThemisWeb/test2.jpg" alt="作品2" loading="lazy">
                            <div class="work-info">日式暖木風空間</div>
                        </div>
                    </a>
                </div>

                <div class="col-md-6" data-aos="fade-up">
                    <a href="#" class="text-decoration-none">
                    <div class="work-card">
                        <img src="../images/ThemisWeb/test3.jpg" alt="作品3" loading="lazy">
                        <div class="work-info">工業風設計</div>
                    </div>
                    </a>
                </div>

                <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                    <a href="#" class="text-decoration-none">
                    <div class="work-card">
                        <img src="../images/ThemisWeb/test4.jpg" alt="作品4" loading="lazy">
                        <div class="work-info">混搭風小宅</div>
                    </div>
                    </a>
                </div>
                <div class="col-md-6" data-aos="fade-up">
                    <a href="#" class="text-decoration-none">
                    <div class="work-card">
                        <img src="../images/ThemisWeb/test5.jpg" alt="作品5" loading="lazy">
                        <div class="work-info">摩登灰階宅邸</div>
                    </div>
                    </a>
                </div>

                <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                    <a href="#" class="text-decoration-none">
                    <div class="work-card">
                        <img src="../images/ThemisWeb/test6.jpg" alt="作品6" loading="lazy">
                        <div class="work-info">北歐風溫馨小家</div>
                    </div>
                    </a>
                </div>

                <div class="col-md-6" data-aos="fade-up">
                    <a href="#" class="text-decoration-none">
                    <div class="work-card">
                        <img src="../images/ThemisWeb/test7.jpg" alt="作品7" loading="lazy">
                        <div class="work-info">極簡黑白美學</div>
                    </div>
                    </a>
                </div>

                <div class="col-md-6" data-aos="fade-up" data-aos-delay="100">
                    <a href="#" class="text-decoration-none">
                    <div class="work-card">
                        <img src="../images/ThemisWeb/test8.jpg" alt="作品8" loading="lazy">
                        <div class="work-info">復古混搭空間</div>
                    </div>
                    </a>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
        <script>
            AOS.init();

            window.addEventListener("scroll", function () {
            const navbar = document.querySelector(".navbar");
            const logo = document.getElementById("navbarLogo");

            if (window.scrollY > 50) {
                navbar.classList.remove("navbar-transparent");
                navbar.classList.add("navbar-colored");
                logo.src = "../images/logocolor.png";
            } else {
                navbar.classList.add("navbar-transparent");
                navbar.classList.remove("navbar-colored");
                logo.src = "../images/logoNocolor.png";
            }
            });
        </script>
    </body>
</html>
